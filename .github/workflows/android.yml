# Construit l'appli Android de Health K' (APK) et la publie dans la release « android ».
# Lien de téléchargement fixe :
#   https://github.com/Kaddraxler24/Health-Track/releases/download/android/health-k.apk
name: Appli Android

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'wear-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Capacitor et les modules
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Synchroniser le projet Android
        working-directory: android-app
        run: npx cap sync android

      - name: Construire l'APK signé
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
          test "${PIPESTATUS[0]}" -eq 0
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/health-k.apk"

      # Appli de la montre (Wear OS) : même identifiant et même clé que l'appli du téléphone
      - name: Construire l'appli montre
        working-directory: wear-app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
          test "${PIPESTATUS[0]}" -eq 0
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/health-k-montre.apk"

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release recréée à chaque construction : la date affichée sur GitHub est celle de la dernière version
          gh release delete android --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create android "$RUNNER_TEMP/health-k.apk" "$RUNNER_TEMP/health-k-montre.apk" --title "Health K' 1.${GITHUB_RUN_NUMBER} pour Android" --latest \
            --notes "Appli Android de Health K', reliée à Santé Connect. Version 1.${GITHUB_RUN_NUMBER} construite le $(TZ=Europe/Paris date +%d/%m/%Y) à $(TZ=Europe/Paris date +%H:%M) (heure de Paris). Téléchargement le plus simple : https://kaddraxler24.github.io/Health-Track/android.html"

      # Copie aussi l'APK sur le site (même adresse que l'appli) : téléchargement direct, sans redirection
      - name: Copier l'APK sur le site
        run: |
          git clone -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          cp "$RUNNER_TEMP/health-k.apk" health-k.apk
          cp "$RUNNER_TEMP/health-k-montre.apk" health-k-montre.apk
          git add health-k.apk health-k-montre.apk
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "APK Health K' 1.${GITHUB_RUN_NUMBER}" || exit 0
          git push -q origin HEAD:main

      # En cas d'échec, le journal est poussé sur la branche « build-logs » pour pouvoir être lu
      - name: Garder le journal d'erreur
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs"
          git init -q && git checkout -q -b build-logs
          tail -c 200000 "$RUNNER_TEMP/build.log" > build.log 2>/dev/null || echo "pas de journal Gradle (échec avant la construction)" > build.log
          git add build.log
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "journal ${GITHUB_RUN_NUMBER}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" build-logs
