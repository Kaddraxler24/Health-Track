plugins { id 'com.android.application' }

android {
    namespace = "io.github.kaddraxler24.healthk.wear"
    compileSdk = 35
    defaultConfig {
        // Même identifiant et même clé que l'appli du téléphone : indispensable pour que les deux se parlent
        applicationId "io.github.kaddraxler24.healthk"
        minSdk 30
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName("1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0"))
    }
    signingConfigs {
        release {
            storeFile file('../../android-app/health-k-release.keystore')
            storePassword 'healthk-android'
            keyAlias 'healthk'
            keyPassword 'healthk-android'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "com.google.android.gms:play-services-wearable:19.0.0"
    implementation "androidx.wear.tiles:tiles:1.4.1"
    implementation "androidx.wear.protolayout:protolayout:1.2.1"
    implementation "androidx.wear.protolayout:protolayout-expression:1.2.1"
    implementation "com.google.guava:guava:33.3.1-android"
}
